name: Deploy web frontend

on:
  push:
    branches:
      - main
    paths:
      - 'src/web/**'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Look up Static Web App
        id: swa
        run: |
          SWA_JSON=$(az staticwebapp list \
            --query "[?name=='${{ vars.STATIC_WEB_APP_NAME }}'] | [0]" \
            --output json)

          if [ "$SWA_JSON" == "null" ] || [ -z "$SWA_JSON" ]; then
            echo "::error::Static Web App '${{ vars.STATIC_WEB_APP_NAME }}' was not found in this subscription."
            exit 1
          fi

          echo "resource_group=$(echo "$SWA_JSON" | jq -r '.resourceGroup')" >> "$GITHUB_OUTPUT"

      - name: Fetch a fresh deployment token
        id: token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name ${{ vars.STATIC_WEB_APP_NAME }} \
            --resource-group ${{ steps.swa.outputs.resource_group }} \
            --query "properties.apiKey" \
            --output tsv)

          if [ -z "$TOKEN" ]; then
            echo "::error::Could not retrieve a deployment token for the Static Web App."
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/web"
          api_location: ""
          output_location: ""
          skip_app_build: true
