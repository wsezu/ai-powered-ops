name: Security Scan

on:
  pull_request:
    paths:
      - '**/*.py'
  push:
    paths:
      - '**/*.py'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit~=1.9.4 pip-audit~=2.10.1
          pip install -r src/python/requirements.txt

      - name: Run Bandit
        run: |
          bandit -r . \
            -x .venv,venv,.git,__pycache__

      - name: Run pip-audit
        run: |
          pip-audit