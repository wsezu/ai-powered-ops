name: Deploy Azure resources

on:
  push:
    branches:
      - main
    paths:
      - infra/**/*.bicep
      - infra/**/*.bicepparam
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az deployment sub create \
            --name "aiops-infra-${{ github.run_id }}" \
            --location "${{ vars.DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs \
            --only-show-errors \
            > /tmp/deployment_outputs.json

      - name: Surface resource names for manual review
        run: |
          FUNCTION_APP_NAME=$(jq -r '.functionAppName.value' /tmp/deployment_outputs.json)
          DATA_STORAGE_ACCOUNT_NAME=$(jq -r '.dataStorageAccountName.value' /tmp/deployment_outputs.json)
          STATIC_WEB_APP_NAME=$(jq -r '.staticWebAppName.value' /tmp/deployment_outputs.json)

          # GITHUB_TOKEN can never write repository variables, regardless of
          # what's granted under `permissions:` — that scope genuinely doesn't
          # exist for the auto-generated token, by design (it stops a workflow
          # from being able to rewrite the credentials that control its own
          # execution). Fixing this properly would need a Personal Access
          # Token capable of writing repo variables — including
          # AZURE_CLIENT_ID/AZURE_TENANT_ID/AZURE_SUBSCRIPTION_ID, the values
          # that determine which Azure identity every workflow in this repo
          # authenticates as. That's a worse trade than three manual updates
          # on the rare occasion these names actually change, so this step
          # only surfaces the current values clearly instead of writing them.
          echo "::notice title=Resource names from this deployment::FUNCTION_APP_NAME=$FUNCTION_APP_NAME | DATA_STORAGE_ACCOUNT_NAME=$DATA_STORAGE_ACCOUNT_NAME | STATIC_WEB_APP_NAME=$STATIC_WEB_APP_NAME"

          echo "If any of these changed (e.g. after switching environments or regions), update the matching repository variable under Settings > Secrets and variables > Actions > Variables."