name: Deploy Azure resources

on:
  push:
    branches:
      - main
    paths:
      - infra/**/*.bicep
      - infra/**/*.bicepparam
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        env:
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          az deployment sub create \
            --name "aiops-infra-${{ github.run_id }}" \
            --location "${{ vars.DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --query properties.outputs \
            --only-show-errors \
            > /tmp/deployment_outputs.json

      - name: Publish resource names as repository variables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set FUNCTION_APP_NAME --body "$(jq -r '.functionAppName.value' /tmp/deployment_outputs.json)"
          gh variable set DATA_STORAGE_ACCOUNT_NAME --body "$(jq -r '.dataStorageAccountName.value' /tmp/deployment_outputs.json)"
          gh variable set STATIC_WEB_APP_NAME --body "$(jq -r '.staticWebAppName.value' /tmp/deployment_outputs.json)"