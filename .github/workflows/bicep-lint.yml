name: Bicep lint

on:
  pull_request:
    branches:
      - main
    paths:
      - '**/*.bicep'
      - '**/*.bicepparam'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  bicep-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Bicep
        run: az bicep install

      - name: Lint Bicep files
        run: |
          find . -name "*.bicep" -print0 | while IFS= read -r -d '' file
          do
            echo "Linting $file"
            az bicep lint --file "$file" --diagnostics-format sarif
          done

      - name: Validate Bicep files
        run: |
          find . -name "*.bicep" -print0 | while IFS= read -r -d '' file
          do
            echo "Checking $file"
            az bicep build --file "$file"
          done

      - name: Validate Bicep parameter files
        run: |
          find . -name "*.bicepparam" -print0 | while IFS= read -r -d '' file
          do
            echo "Checking $file"
            az bicep build-params --file "$file"
          done